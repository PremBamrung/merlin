<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin — Proposed Frontend</title>
  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: #0f0e0d; }

    /* Tweaks panel */
    .tweaks-panel {
      position: fixed; bottom: 20px; right: 20px;
      z-index: 100;
      width: 280px;
      background: #171614;
      border: 1px solid rgba(255,246,230,0.14);
      border-radius: 12px;
      padding: 16px;
      color: #f5efe4;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      display: none;
    }
    .tweaks-panel.visible { display: block; }
    .tweaks-panel h3 {
      font-family: 'Instrument Serif', serif;
      font-size: 18px; margin: 0 0 12px;
      font-weight: 400;
    }
    .tweak-row { margin-bottom: 14px; }
    .tweak-label {
      font-size: 10.5px; text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a19a8d; margin-bottom: 6px;
    }
    .tweak-opts {
      display: flex; gap: 4px;
      background: #1e1c1a;
      border: 1px solid rgba(255,246,230,0.08);
      border-radius: 6px; padding: 2px;
    }
    .tweak-opts button {
      flex: 1;
      background: transparent; border: 0;
      color: #a19a8d;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .tweak-opts button.active {
      background: #262320;
      color: #f5efe4;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Tweaks panel -->
  <div class="tweaks-panel" id="tweaks">
    <h3>Tweaks</h3>
    <div class="tweak-row">
      <div class="tweak-label">Aesthetic</div>
      <div class="tweak-opts" data-key="theme">
        <button data-val="obsidian" class="active">Obsidian</button>
        <button data-val="papyrus">Papyrus</button>
      </div>
    </div>
    <div class="tweak-row">
      <div class="tweak-label">Sidebar</div>
      <div class="tweak-opts" data-key="sidebar">
        <button data-val="expanded" class="active">Expanded</button>
        <button data-val="compact">Compact</button>
      </div>
    </div>
    <div class="tweak-row">
      <div class="tweak-label">Brand mark</div>
      <div class="tweak-opts" data-key="mark">
        <button data-val="star" class="active">✦</button>
        <button data-val="m">M</button>
        <button data-val="none">—</button>
      </div>
    </div>
  </div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="screen-today.jsx"></script>
  <script type="text/babel" src="screen-library.jsx"></script>
  <script type="text/babel" src="screen-youtube.jsx"></script>
  <script type="text/babel" src="screen-chat.jsx"></script>
  <script type="text/babel" src="screen-graph.jsx"></script>
  <script type="text/babel" src="screen-inbox.jsx"></script>
  <script type="text/babel" src="screen-share.jsx"></script>
  <script type="text/babel" src="screen-reddit.jsx"></script>
  <script type="text/babel" src="screen-ingest.jsx"></script>
  <script type="text/babel" src="screen-digest.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Tweakable defaults
    const TWEAKS = /*EDITMODE-BEGIN*/{
      "theme": "papyrus",
      "sidebar": "expanded",
      "mark": "star"
    }/*EDITMODE-END*/;

    // Apply tweaks to DOM
    function applyTweaks(t) {
      document.documentElement.setAttribute('data-theme', t.theme);
      document.documentElement.setAttribute('data-sidebar', t.sidebar);
      document.documentElement.setAttribute('data-mark', t.mark);
      // apply mark swap
      document.querySelectorAll('.side-brand .mark').forEach(el => {
        el.textContent = t.mark === 'star' ? '✦' : t.mark === 'm' ? 'M' : '';
        el.style.display = t.mark === 'none' ? 'none' : '';
      });
    }

    // ==== Canvas with all screens ====
    function App() {
      useEffect(() => {
        applyTweaks(TWEAKS);

        // Wire tweaks panel
        document.querySelectorAll('.tweak-opts').forEach(group => {
          const key = group.dataset.key;
          group.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
              group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              TWEAKS[key] = btn.dataset.val;
              applyTweaks(TWEAKS);
              // Re-apply to newly-rendered brand marks (after react rerender)
              setTimeout(() => applyTweaks(TWEAKS), 50);
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: btn.dataset.val } }, '*');
            });
          });
        });

        // Edit mode protocol
        const handler = (e) => {
          if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks').classList.add('visible');
          if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('visible');
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      const sections = [
        {
          id: 'newsletter',
          title: 'Merlin as your newsletter',
          subtitle: 'Merlin scans trusted voices (Karpathy, Huyen, your subs) + YouTube recommendations, matches against your tags, and hands you a tight daily digest. One tap to ingest.',
          artboards: [
            { id: 'digest', label: '01 · Daily digest', w: 1200, h: 1280, Comp: window.DigestScreen },
            { id: 'follows', label: '02 · Voices & feeds — who Merlin watches', w: 1200, h: 1100, Comp: window.FollowsScreen },
          ],
        },
        {
          id: 'everyday',
          title: 'Everyday flows',
          subtitle: 'The three surfaces you\'ll hit 50 times a day. Dump links in, the library organizes itself, and you ask questions back.',
          artboards: [
            { id: 'today', label: '03 · Today — the omnibox', w: 1200, h: 840, Comp: window.TodayScreen },
            { id: 'library', label: '04 · Library', w: 1280, h: 900, Comp: window.LibraryScreen },
            { id: 'chat-rag', label: '05 · Chat your library', w: 1280, h: 880, Comp: window.ChatScreen },
          ],
        },
        {
          id: 'ingestion',
          title: 'Ingestion — paste, tag, forget',
          subtitle: 'Every link triggers a small pipeline: fetch, summarize, propose tags (reusing existing ones where possible), extract metadata, queue up.',
          artboards: [
            { id: 'inbox', label: '06 · Inbox (live queue + auto-rules)', w: 1200, h: 900, Comp: window.InboxScreen },
            { id: 'review', label: '07 · Ingest review — tag suggestions', w: 1200, h: 980, Comp: window.IngestReviewScreen },
          ],
        },
        {
          id: 'sources',
          title: 'Source detail',
          subtitle: 'Each content type gets its own reading surface — video with timestamped chat, blogs like Reader, Reddit with synthesized threads + top comments.',
          artboards: [
            { id: 'youtube', label: '08 · YouTube — chat with video + top comments', w: 1280, h: 1000, Comp: window.YoutubeScreen },
            { id: 'reddit', label: '09 · Reddit — thread + top comments', w: 1200, h: 960, Comp: window.RedditScreen },
            { id: 'blog', label: '10 · Blog summary + public share', w: 1200, h: 960, Comp: window.ShareScreen },
          ],
        },
        {
          id: 'power',
          title: 'Power surfaces',
          subtitle: 'The agentic chat with tool traces (internal + MCP) and the constellation graph view of your knowledge web.',
          artboards: [
            { id: 'agentic', label: '11 · Agentic chat — tools & MCP', w: 1280, h: 880, Comp: window.AgenticChatScreen },
            { id: 'graph', label: '12 · Graph view', w: 1280, h: 800, Comp: window.GraphScreen },
          ],
        },
        {
          id: 'platform',
          title: 'Platform — mobile & storage',
          subtitle: 'Self-hostable web app, works on phone. Markdown on disk for your docs; SQLite (or Postgres, one env var) for search, graph, and chat history.',
          artboards: [
            { id: 'mobile', label: '13 · Mobile — responsive web app', w: 440, h: 820, Comp: window.MobileScreen },
            { id: 'storage', label: '14 · Storage — md + db architecture', w: 1200, h: 900, Comp: window.StorageScreen },
          ],
        },
      ];

      const { DesignCanvas, DCSection, DCArtboard } = window;

      return (
        <DesignCanvas
          title="Merlin — proposed frontend"
          subtitle="A FastAPI-ready, local-first knowledge companion. Replaces Streamlit with a sleek, agentic interface."
        >
          {sections.map(s => (
            <DCSection key={s.id} id={s.id} title={s.title} subtitle={s.subtitle}>
              {s.artboards.map(a => (
                <DCArtboard key={a.id} id={a.id} label={a.label} width={a.w} height={a.h}>
                  <a.Comp />
                </DCArtboard>
              ))}
            </DCSection>
          ))}
        </DesignCanvas>
      );
    }

    // Watch for brand marks being rendered and apply the mark tweak
    const observer = new MutationObserver(() => {
      const mark = TWEAKS.mark;
      document.querySelectorAll('.side-brand .mark').forEach(el => {
        const want = mark === 'star' ? '✦' : mark === 'm' ? 'M' : '';
        if (el.textContent !== want) el.textContent = want;
        el.style.display = mark === 'none' ? 'none' : '';
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

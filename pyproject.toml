[project]
name = "merlin"
version = "2.0.0"
description = "Personal knowledge management app"
requires-python = ">=3.11"
dependencies = [
    # FastAPI backend (v3 — serves /api/* + the built React SPA)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    # Database / migrations
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    # LLM
    "langchain>=0.3.7",
    "langchain-core>=0.3.19",
    "langchain-openai>=0.2.8",
    "openai>=1.0.0",
    # YouTube processing
    "pytube>=15.0.0",
    "youtube-transcript-api>=1.2.3",
    "yt-dlp>=2025.2.19",
    "Pillow>=11.0.0",
    # Utilities
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "groq>=0.12.0",
    # Dev
    "pytest>=9.0.0",
    "pytest-xdist>=3.8.0",
    "pydantic-ai>=1.107.0",
]

[tool.uv]
# The `merlin` package is imported from the repo root (cwd), the same way
# `uvicorn api.main:app` resolves it — uv does not need to build/install it.
package = false

[tool.ruff]
# Enable Ruff linting and formatting
target-version = "py311"
line-length = 88  # Match Black's default
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
# Enable commonly used rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls these in argument defaults
# (e.g. `tags: list[str] | None = Query(None)`), which B008 would flag.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
]

[tool.ruff.lint.isort]
# Configure isort to match Black's style
# Black-compatible settings (no profile field in newer Ruff versions)
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.format]
# Use double quotes for strings (Black's default)
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Use LF line endings
line-ending = "auto"

[dependency-groups]
dev = [
    "playwright>=1.60.0",
]


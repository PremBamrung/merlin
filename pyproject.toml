[tool.ruff]
# Enable Ruff linting and formatting
target-version = "py311"
line-length = 88  # Match Black's default
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
# Enable commonly used rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
# Match isort configuration with black profile
profile = "black"

[tool.ruff.format]
# Use double quotes for strings (Black's default)
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Use LF line endings
line-ending = "auto"


<!-- The mark, `star` form (see src/components/brand/Mark.tsx). NOT the monogram:
     at favicon sizes the drawn M is under 4px tall and turns to mush, which is
     the documented blocker on using M1 here. Geometry is D2 — steeper cone, wide
     brim, and the brim separated from the cone by 0.9 units of ground. -->

  <path d="M12 2.4L17.8 17.6H6.2Z" fill="#2B3C9E"/>
  <circle cx="12" cy="13.2" r="2.5" fill="#FFB94A"/>
  <rect x="4" y="18.5" width="16" height="2.6" rx="1.3" fill="#4B5CB8"/>
</svg>

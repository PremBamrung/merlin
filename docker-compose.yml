services:
  # v3 runtime: FastAPI serves /api/* (and the built React SPA at / when present).
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # Trace files (merlin/core/telemetry.py), on the mounted ./logs volume.
      # Set TRACES_DIR= (empty) in .env to turn tracing off.
      - TRACES_DIR=${TRACES_DIR-/app/logs/traces}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
